<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2b1055"><title>Mini Emperor Josh: Pint Catcher</title>
<link rel="icon" href="assets/pint@2x.png"><link rel="stylesheet" href="style.css"></head><body>
<canvas id="c"></canvas>
<div id="title" class="ov"><h1>Mini Emperor<br>Josh</h1><p class="sub">🍺 Pint Catcher 🍺</p><p>Drag or tap left/right to catch pints in his mouth.<br>🌟 Golden pint = +5 &nbsp; 💧 Water &amp; 🚫 "No!" signs = lose a life<br>Miss 3 pints and it's last orders.</p><button id="play">PLAY</button><div id="lbT"></div></div>
<div id="over" class="ov hide"><h2>Last Orders!</h2><p class="big" id="fs"></p><p id="msg"></p>
<div id="entry"><input id="nm" maxlength="12" placeholder="Your name"><button id="save">Save</button></div>
<div id="lbO"></div><button id="share">📤 Share score</button><button id="again">Play again</button><p id="toast"></p></div>
<script src="game.js"></script></body></html>
